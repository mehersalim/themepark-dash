name: CI

on:
  pull_request:
  workflow_call:   # lets deploy.yml reuse this exact job

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: themepark
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/themepark
      PGSSL_DISABLE: '1'
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Apply schema to the CI database
        run: psql "$DATABASE_URL" -f ../db/schema.sql
      - run: npm test

  # web:  (add on Wednesday) npm ci, ng lint, ng test --watch=false, ng build
