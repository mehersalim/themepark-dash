name: Deploy

# Every merge to main: run the tests, then deploy the API and the dashboard to Azure.
on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you re-run a deploy by hand from the Actions tab

permissions:
  contents: read
  id-token: write      # lets GitHub prove its identity to Azure (no stored password)

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy-api:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Build and stage only what Azure needs
        working-directory: api
        run: |
          npm ci
          npm run build
          npm prune --omit=dev
          mkdir deploy
          cp -r host.json package.json dist node_modules deploy/
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: api/deploy
          sku: flexconsumption
      - name: Smoke test the live API
        run: |
          curl --retry 8 --retry-delay 10 --retry-all-errors -fsS \
            "https://${{ vars.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/health"

  deploy-web:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the dashboard
        working-directory: web
        run: |
          npm ci
          npx ng build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist/web/browser
          output_location: ''
          skip_app_build: true
          skip_api_build: true
